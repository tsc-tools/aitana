[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitana-access"
version = "0.1.3"
authors = [
  { name="Yannik Behr", email="y.behr@gns.cri.nz" },
]
description = "Pure I/O access layer for volcano monitoring data (GeoNet TILDE, WFS, seismic waveforms)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas>=2.3.3,<4",
    "requests>=2.32.5,<3",
    "obspy>=1.4.2,<2",
    "fsspec>=2024.0.0",
    "statsmodels>=0.14.6,<0.15",
    "matplotlib>=3.10.8,<4",
    "scipy>=1.15.0",
    "numpy>=1.26.0",
    "fastapi",
    "uvicorn",
    "aitana-storage>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aitana"]

[tool.hatch.envs.test]
dependencies = [
  "pytest",
  "httpx",
  "moto[s3]",
]
[[tool.hatch.envs.test.matrix]]
python = ["3.11", "3.12", "3.13"]

[tool.hatch.envs.test.scripts]
run-pytest = "pytest tests {args}"

[tool.uv.sources]
aitana-storage = { workspace = true }

[project.urls]
Homepage = "https://github.com/tsc-tools/aitana"
