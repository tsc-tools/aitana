[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitana-pipelines"
version = "0.1.0"
authors = [
  { name="Yannik Behr", email="y.behr@gns.cri.nz" },
]
description = "Reproducible workflows that run and evaluate aitana components for volcano monitoring."
requires-python = ">=3.10,<3.13"
dependencies = [
    "aitana-volcanoes>=0.1.0",
    "snakemake>=9.16.3,<10",
    "typer>=0.25,<1",
    "matplotlib>=3.10.8,<4",
    "aitana-storage>=0.1.0",
    "apscheduler>=3.11,<4",
    "aitana-anomaly>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aitana"]

[project.scripts]
aitana-pipelines = "aitana.pipelines.cli:app"

[project.entry-points."aitana.pipelines.workflows"]
whakaari_bn_2026 = "aitana.pipelines.workflows.whakaari_bn_2026:workflow"
ruapehu_mp = "aitana.pipelines.workflows.ruapehu_mp:workflow"

[tool.uv.sources]
aitana-volcanoes = { workspace = true }
aitana-storage = { workspace = true }
aitana-anomaly = { workspace = true }

[project.urls]
Homepage = "https://github.com/tsc-tools/aitana"
