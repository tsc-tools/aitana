[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitana-testing"
version = "0.1.0"
authors = [
  { name="Yannik Behr", email="y.behr@gns.cri.nz" },
]
description = "Synthetic seismic waveforms with known spectral content for testing aitana packages."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.15.0",
    "obspy>=1.4.2,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aitana"]

[project.urls]
Homepage = "https://github.com/tsc-tools/aitana"
