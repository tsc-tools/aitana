[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10,<3.13"

[pypi-dependencies]
aitana-access    = { path = "./aitana-access",    editable = true }
aitana-features  = { path = "./aitana-features",  editable = true }
aitana-volcanoes = { path = "./aitana-volcanoes", editable = true }
aitana-bench     = { path = "./aitana-bench",     editable = true }
aitana-anomaly   = { path = "./aitana-anomaly",   editable = true }
aitana-storage   = { path = "./aitana-storage",   editable = true }

[environments]
default = { features = ["dev"], solve-group = "default" }

[feature.dev.pypi-dependencies]
pytest = "*"
httpx = "*"
build = ">=1.3.0,<2"
twine = ">=6.2.0,<7"
import-linter = "*"
moto = { version = ">=5.1.19,<6", extras = ["s3"] }
mkdocs = ">=1.6.1,<2"
mkdocstrings = { version = ">=1.0.4,<2", extras = ["python"] }
plotly = ">=6.5.0,<7"
ipykernel = ">=6.31.0,<7"
