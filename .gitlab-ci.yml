variables:
  IMAGE: "${AWS_SHARED_SERVICES_ECR}/volcanology/aitana:$CI_COMMIT_BRANCH"
  APP_SERVER: "Ruamoko"
  TEAM: "Volcano"

stages:
  - build
  - deploy

build:
  tags:
    - linux
  stage: build
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - when: always
  script:
    - DOCKER_BUILDKIT=1 docker build -f docker/Dockerfile -t "$IMAGE" .
    - docker image push "$IMAGE"

deploy-api:
  tags:
    - linux
  stage: deploy
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - when: always 
  variables:
    API_PORT: "8053"
  before_script:
      - git clone https://oauth2:$gitlabcicd@git.gns.cri.nz/production/gessp-operational
  after_script:
      - rm -rf gessp-operational
      - git clean -fdX  
  script: |
    cat > /tmp/docker_config.json <<EOF
    {
      "Image": "${IMAGE}",
      "Cmd": ["sh", "-c", "test_data && tonik_api"],
      "HostConfig": {
        "PortBindings": { "8003/tcp": [{ "HostPort": "${API_PORT}" }] },
        "ExposedPorts": { "8003/tcp": {} },
        "RestartPolicy": { "Name": "always" }
      }
    }
    EOF
    cat /tmp/docker_config.json
    python3 ./gessp-operational/deploy-scripts/docker_deploy.py -a "tonik-${CI_COMMIT_BRANCH}" -s "$APP_SERVER" -t "$TEAM" /tmp/docker_config.json
    rm /tmp/docker_config.json

# The Ruapehu alert daemons post to a shared Slack channel, so only the default
# branch runs them. Both mount the same named volume; the pipeline writes it,
# the bot only reads it.
.deploy-default-branch:
  tags:
    - linux
  stage: deploy
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    DATA_VOLUME: "aitana-ruapehu-mp"
  before_script:
      - git clone https://oauth2:$gitlabcicd@git.gns.cri.nz/production/gessp-operational
  after_script:
      - rm -rf gessp-operational
      - git clean -fdX

# Runs the ruapehu_mp workflow every 10 minutes, 2 minutes after each 10-min
# boundary so GeoNet's near-real-time data has arrived. The volume is mounted
# on ~/data, which exists in the image, so a new volume is owned by bayes.
deploy-ruapehu-mp:
  extends: .deploy-default-branch
  script: |
    cat > /tmp/docker_config.json <<EOF
    {
      "Image": "${IMAGE}",
      "Cmd": ["aitana-pipelines", "run", "ruapehu", "/home/bayes/data/ruapehu_mp",
              "--cron", "2-59/10 * * * *"],
      "HostConfig": {
        "Binds": ["${DATA_VOLUME}:/home/bayes/data"],
        "Init": true,
        "RestartPolicy": { "Name": "always" }
      }
    }
    EOF
    cat /tmp/docker_config.json
    python3 ./gessp-operational/deploy-scripts/docker_deploy.py -a "aitana-ruapehu-mp" -s "$APP_SERVER" -t "$TEAM" /tmp/docker_config.json
    rm /tmp/docker_config.json

# Posts each newly raised ruapehu_mp alarm to Slack.
deploy-bot:
  extends: .deploy-default-branch
  script: |
    cat > /tmp/docker_config.json <<EOF
    {
      "Image": "${IMAGE}",
      "Cmd": ["aitana-bot", "watch", "/home/bayes/data/ruapehu_mp"],
      "Env": [
        "SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}",
        "SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}"
      ],
      "HostConfig": {
        "Binds": ["${DATA_VOLUME}:/home/bayes/data:ro"],
        "Init": true,
        "RestartPolicy": { "Name": "always" }
      }
    }
    EOF
    # No `cat` of the config here: it holds the Slack token.
    python3 ./gessp-operational/deploy-scripts/docker_deploy.py -a "aitana-bot" -s "$APP_SERVER" -t "$TEAM" /tmp/docker_config.json
    rm /tmp/docker_config.json
