variables:
  IMAGE: "${AWS_SHARED_SERVICES_ECR}/volcanology/aitana:$CI_COMMIT_BRANCH"
  APP_SERVER: "Ruamoko"
  TEAM: "Volcano"
  D_UID: "2737"
  D_GID: "2737"
  DATA_VOLUME: "/scratch/behrya/aitana/data"

stages:
  - build
  - deploy

build:
  tags:
    - linux
  stage: build
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - when: always
  script:
    - DOCKER_BUILDKIT=1 docker build -f docker/Dockerfile --build-arg D_UID="$D_UID" --build-arg D_GID="$D_GID" -t "$IMAGE" .
    - docker image push "$IMAGE"

.deploy-default-branch:
  tags:
    - linux
  stage: deploy
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
      - git clone https://oauth2:$gitlabcicd@git.gns.cri.nz/production/gessp-operational
  after_script:
      - rm -rf gessp-operational
      - git clean -fdX

# Runs the ruapehu_mp workflow every 10 minutes, 2 minutes after each 10-min
# boundary so GeoNet's near-real-time data has arrived. The volume is mounted
# on ~/data, which exists in the image, so a new volume is owned by bayes.
deploy-ruapehu-mp:
  extends: .deploy-default-branch
  script: |
    cat > /tmp/docker_config.json <<EOF
    {
      "Image": "${IMAGE}",
      "Cmd": ["aitana-pipelines", "run", "ruapehu", "/home/bayes/data/ruapehu_mp",
              "--cron", "2-59/10 * * * *"],
      "HostConfig": {
        "Binds": ["${DATA_VOLUME}:/home/bayes/data"],
        "RestartPolicy": { "Name": "always" }
      }
    }
    EOF
    cat /tmp/docker_config.json
    python3 ./gessp-operational/deploy-scripts/docker_deploy.py -a "aitana-ruapehu-mp" -s "$APP_SERVER" -t "$TEAM" /tmp/docker_config.json
    rm /tmp/docker_config.json

# Serves the ruapehu_mp storage (RSAM, anomaly index, alarm series) to Grafana,
# which plots it and alerts on the alarm series.
deploy-ruapehu-api:
  extends: .deploy-default-branch
  variables:
    API_PORT: "8053"
  script: |
    cat > /tmp/docker_config.json <<EOF
    {
      "Image": "${IMAGE}",
      "Cmd": ["aitana-api", "--rootdir", "/home/bayes/data/ruapehu_mp/storage"],
      "HostConfig": {
        "Binds": ["${DATA_VOLUME}:/home/bayes/data:ro"],
        "PortBindings": { "8003/tcp": [{ "HostPort": "${API_PORT}" }] },
        "ExposedPorts": { "8003/tcp": {} },
        "RestartPolicy": { "Name": "always" }
      }
    }
    EOF
    cat /tmp/docker_config.json
    python3 ./gessp-operational/deploy-scripts/docker_deploy.py -a "aitana-ruapehu-api" -s "$APP_SERVER" -t "$TEAM" /tmp/docker_config.json
    rm /tmp/docker_config.json

# Syncs the labels drawn in Grafana with ~/data/labels.json every 10 minutes,
# so a redeployed Grafana gets its labels back within 10 minutes. Needs the
# CI/CD variables GRAFANA_URL (base URL, e.g. http://grafana.example:3000),
# GRAFANA_USER and GRAFANA_PASSWORD (masked) of a Grafana user allowed to read,
# create and edit annotations. A failed sync is logged and retried at the next
# round.
deploy-label-sync:
  extends: .deploy-default-branch
  script: |
    cat > /tmp/docker_config.json <<EOF
    {
      "Image": "${IMAGE}",
      "Cmd": ["sh", "-c", "while true; do grafana_annotations ${GRAFANA_URL} --file /home/bayes/data/labels.json; sleep 600; done"],
      "Env": ["GRAFANA_USER=${GRAFANA_USER}", "GRAFANA_PASSWORD=${GRAFANA_PASSWORD}"],
      "HostConfig": {
        "Binds": ["${DATA_VOLUME}:/home/bayes/data"],
        "RestartPolicy": { "Name": "always" }
      }
    }
    EOF
    # No `cat` of the config here: it holds the Grafana password.
    python3 ./gessp-operational/deploy-scripts/docker_deploy.py -a "aitana-label-sync" -s "$APP_SERVER" -t "$TEAM" /tmp/docker_config.json
    rm /tmp/docker_config.json
