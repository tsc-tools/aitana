[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitana-volcanoes"
version = "0.1.0"
authors = [
  { name="Yannik Behr", email="y.behr@gns.cri.nz" },
]
description = "Per-volcano domain aggregates for Ruapehu, Whakaari, and Taupo."
requires-python = ">=3.10,<3.13"
dependencies = [
    "aitana-access>=0.1.0",
    "aitana-features>=0.1.0",
    "pandas>=2.3.3,<3",
    "numpy>=1.26.0",
    "statsmodels>=0.14.6,<0.15",
    "requests>=2.32.5,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aitana"]

[tool.hatch.build]
include = ["src/aitana/volcanoes/data/**"]

[tool.hatch.build.targets.sdist]
exclude = [
  "src/aitana/volcanoes/data/RSAM_NZ.WIZ.10.HHZ.csv",
]

[tool.uv.sources]
aitana-access = { workspace = true }
aitana-features = { workspace = true }

[project.urls]
Homepage = "https://github.com/tsc-tools/aitana"
