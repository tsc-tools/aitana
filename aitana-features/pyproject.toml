[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitana-features"
version = "0.1.0"
authors = [
  { name="Yannik Behr", email="y.behr@gns.cri.nz" },
]
description = "Algorithms over in-memory waveforms for volcano monitoring (RSAM, DSAR, SSAM)."
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.15.0",
    "pandas>=2.3.3,<3",
    "obspy>=1.4.2,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aitana"]

[project.urls]
Homepage = "https://github.com/tsc-tools/aitana"
