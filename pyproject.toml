[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/dist",
  "/site",
  "/docs",
  "/sandbox.ipynb",
  "/src/aitana/data/RSAM_NZ.WIZ.10.HHZ.csv"
]

[project]
name = "aitana"
version = "0.1.12"
authors = [
  { name="Yannik Behr", email="y.behr@gns.cri.nz" },
]

description = "Access volcano monitoring data."
readme = "README.md"
requires-python = ">=3.10,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.3.3,<3",
    "requests>=2.32.5,<3",
    "matplotlib>=3.10.8,<4",
    "statsmodels>=0.14.6,<0.15",
    "obspy>=1.4.2,<2",
    "snakemake>=9.16.3,<10",
    "tonik>=0.1.23,<0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/aitana"]

[tool.hatch.build]
include = ["src/aitana/data/**"]

[project.optional-dependencies]
dev = [
  "pytest",
  "build>=1.3.0,<2",
  "twine>=6.2.0,<7",
  "mkdocs",
  "mkdocstrings[python]",
  "mkdocs-jupyter",
  "plotly>=6.5.0,<7",
  "ipykernel>=6.31.0,<7"
]

[project.scripts]
volcanobench = "aitana.volcanobench:app"

[project.entry-points."volcanobench.workflows"]
whakaari_bn_2026 = "aitana.workflows.whakaari_bn_2026:workflow"

[project.urls]
Homepage = "https://github.com/tsc-tools/aitana"
Issues = "https://github.com/tsc-tools/aitana/issues"


[tool.pytest.ini_options]
log_cli = true
