[tool.pytest.ini_options]
log_cli = true

[tool.importlinter]
root_packages = ["aitana"]

[[tool.importlinter.contracts]]
name = "access is pure I/O"
type = "forbidden"
source_modules = ["aitana.access"]
forbidden_modules = ["aitana.volcanoes", "aitana.features", "aitana.bench"]

[[tool.importlinter.contracts]]
name = "features never fetches"
type = "forbidden"
source_modules = ["aitana.features"]
forbidden_modules = ["aitana.access", "aitana.volcanoes", "aitana.bench"]

[[tool.importlinter.contracts]]
name = "volcanoes does not import bench"
type = "forbidden"
source_modules = ["aitana.volcanoes"]
forbidden_modules = ["aitana.bench"]
