[tool.uv.workspace]
members = [
  "aitana-access",
  "aitana-features",
  "aitana-volcanoes",
  "aitana-pipelines",
  "aitana-anomaly",
  "aitana-storage",
  "aitana-testing",
  "aitana-bot",
]

[dependency-groups]
dev = [
  "pytest",
  "httpx",
  "build>=1.3.0,<2",
  "twine>=6.2.0,<7",
  "import-linter",
  "moto[s3]>=5.1.19,<6",
  "plotly>=6.5.0,<7",
  "ipykernel>=6.31.0,<7",
  "pyyaml",
  "nbclient",
  "nbformat",
  "pip-audit",
  "torch>=2.13.0",
  "great-docs>=0.17.0,<0.18",
]

[tool.pytest.ini_options]
log_cli = true
addopts = "--import-mode=importlib"
# Per-package tests run in isolation via each package's hatch env;
# the root `tests/` holds cross-package integration tests.
testpaths = ["aitana-*/tests", "tests"]

[tool.importlinter]
root_packages = ["aitana"]

[[tool.importlinter.contracts]]
name = "access is pure I/O"
type = "forbidden"
source_modules = ["aitana.access"]
forbidden_modules = ["aitana.volcanoes", "aitana.features", "aitana.pipelines"]

[[tool.importlinter.contracts]]
name = "features never fetches"
type = "forbidden"
source_modules = ["aitana.features"]
forbidden_modules = ["aitana.access", "aitana.volcanoes", "aitana.pipelines"]

[[tool.importlinter.contracts]]
name = "volcanoes does not import pipelines"
type = "forbidden"
source_modules = ["aitana.volcanoes"]
forbidden_modules = ["aitana.pipelines"]
