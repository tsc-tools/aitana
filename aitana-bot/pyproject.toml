[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitana-bot"
version = "0.1.0"
authors = [
  { name="Yannik Behr", email="y.behr@gns.cri.nz" },
]
description = "Slack notifications for Aitana workflow alerts"
requires-python = ">=3.10,<3.13"
dependencies = [
    "slack_sdk>=3,<4",
    "typer>=0.25,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aitana"]

[project.scripts]
aitana-bot = "aitana.bot.cli:app"

[project.urls]
Homepage = "https://github.com/tsc-tools/aitana"
