[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitana-bench"
version = "0.1.0"
authors = [
  { name="Yannik Behr", email="y.behr@gns.cri.nz" },
]
description = "Benchmarking CLI and scoring tools for volcano monitoring AI/ML models."
requires-python = ">=3.10,<3.13"
dependencies = [
    "aitana-volcanoes>=0.1.0",
    "snakemake>=9.16.3,<10",
    "typer>=0.25,<1",
    "matplotlib>=3.10.8,<4",
    "aitana-storage>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aitana"]

[tool.hatch.build]
include = ["src/aitana/bench/data/**"]

[project.scripts]
volcanobench = "aitana.bench.volcanobench:app"

[project.entry-points."volcanobench.workflows"]
whakaari_bn_2026 = "aitana.bench.workflows.whakaari_bn_2026:workflow"

[project.urls]
Homepage = "https://github.com/tsc-tools/aitana"
