# Great Docs configuration. Build with `great-docs build`, view with
# `great-docs preview`. `great-docs config` prints every option with its default;
# see also https://posit-dev.github.io/great-docs/user-guide/configuration.html
#
# aitana is a PEP 420 namespace package spread over the aitana-* distributions,
# so there is no top-level module to auto-discover the API from. The reference
# below is listed explicitly, one section per distribution; add new public
# classes and functions here.

module: aitana
display_name: Aitana
parser: numpy
# Dynamic introspection cannot getattr() namespace sub-packages that have not
# been imported, so use static analysis (griffe).
dynamic: false
repo: https://github.com/tsc-tools/aitana
site_url: https://tsc-tools.github.io/aitana/

# User guide pages are read from user_guide/; this adds a navbar section built
# from developer/. Numeric filename prefixes set the order and are dropped from URLs.
sections:
  - title: Developers
    dir: developer

reference:
